name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze PHP
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: php
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:php"
          output: ${{ runner.temp }}/codeql-sarif
          upload: always
          wait-for-processing: true

      - name: Build Markdown report
        if: always() && steps.analyze.outcome == 'success'
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          python3 .github/scripts/codeql-sarif-report.py \
            "${SARIF_DIR}" \
            --output "${{ runner.temp }}/codeql-report.md" \
            --repository "${{ github.repository }}" \
            --sha "${{ github.sha }}" \
            --query-suite security-and-quality \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload CodeQL reports
        if: always() && steps.analyze.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: codeql-security-report
          path: |
            ${{ steps.analyze.outputs.sarif-output }}
            ${{ runner.temp }}/codeql-report.md
          if-no-files-found: error
          retention-days: 90
